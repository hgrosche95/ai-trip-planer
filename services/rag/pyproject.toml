[project]
name = "rag-service"
version = "0.1.0"
description = "RAG-Service: lokale Embeddings, Ingestion und semantische Suche für die Wissensbasis des Trip Planners"
authors = [
    { name = "hgrosche95", email = "h.grosche95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
