[project]
name = "rag-service"
version = "0.1.0"
description = "RAG-Service: lokale Embeddings, Ingestion und semantische Suche für die Wissensbasis des Trip Planners"
authors = [
    { name = "hgrosche95", email = "h.grosche95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
rag-ingest = "rag_service.ingest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
# 120 statt Default 88/100: die deutschen Docstrings/Kommentare in diesem
# Service sind bewusst ausführlich (siehe Repo-weiter Stil), 100 hätte an
# etlichen bestehenden, inhaltlich sinnvollen Zeilen erzwungene Umbrüche
# verlangt statt echte Probleme zu finden.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# fastembed/pgvector liefern keine Typangaben - ohne diese Ausnahme würde
# jeder Import daraus strict-mode fehlschlagen, obwohl der eigene Code
# vollständig typisiert ist.
ignore_missing_imports = true
