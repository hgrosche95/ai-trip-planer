# Wöchentliche Update-PRs statt Sicherheitslücken erst beim nächsten Review zu
# finden. Minor- und Patch-Updates kommen gebündelt als ein PR pro Ökosystem,
# damit das Postfach nicht mit Einzel-PRs vollläuft; Major-Updates einzeln,
# weil die meist Code-Änderungen brauchen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # NestJS-Pakete müssen dieselbe Hauptversion haben (platform-express 12
      # mit core 11 startet nicht, siehe job-application-skill#14). Deshalb
      # immer zusammen, auch bei Majors.
      nestjs:
        patterns: ["@nestjs/*"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/rag
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/api, /services/rag]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
