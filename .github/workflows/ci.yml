name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    needs: lint-test-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trip_planner
          POSTGRES_PASSWORD: trip_planner
          POSTGRES_DB: trip_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trip_planner:trip_planner@localhost:5432/trip_planner?schema=public
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Datenbank-Migrationen anwenden
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: E2E-Tests ausführen
        run: npm run test:e2e --workspace=e2e
