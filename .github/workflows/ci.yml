name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    needs: lint-test-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: trip_planner
          POSTGRES_PASSWORD: trip_planner
          POSTGRES_DB: trip_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trip_planner:trip_planner@localhost:5432/trip_planner?schema=public
      # Nur ein ANTHROPIC_API_KEY-Repository-Secret existiert, kein GROQ_API_KEY -
      # deshalb hier explizit auf anthropic statt auf dem Groq-Default bleiben.
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3000
      # services: kann nur fertige Images ziehen, nicht aus einem lokalen
      # Dockerfile bauen - der RAG-Service wird deshalb weiter unten per
      # docker build/run gestartet, nicht über den services-Block wie
      # postgres. --network host (nur auf Linux-Runnern verfügbar, hier
      # der Fall) lässt den Container direkt "localhost" des Runners sehen,
      # genau wie die restlichen Prozesse in diesem Job.
      RAG_SERVICE_URL: http://localhost:8001
      # Nur für diesen CI-Lauf gültig (ephemere Postgres-Instanz, kein echter Nutzer) -
      # deshalb hier als Klartext statt als Repo-Secret, genau wie die Postgres-Zugangsdaten oben.
      AUTH_USERNAME: e2e-test
      AUTH_PASSWORD_HASH: $2b$10$zwnaSFwRDXWN8ARQ2MKCReoqD566HMLU2DDgb2BZwoNNXRS82H91C
      JWT_SECRET: Ddo4z26AQj4WRfpebbv+9hVNMwlUzyLsUWo8Ejstgkg=
      # Klartext-Gegenstück zu AUTH_PASSWORD_HASH oben - nur der Playwright-Prozess
      # braucht das (zum Ausfüllen des Login-Formulars), das Backend kennt nur den Hash.
      E2E_AUTH_USERNAME: e2e-test
      E2E_AUTH_PASSWORD: e2e-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Datenbank-Migrationen anwenden
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: RAG-Service bauen
        run: docker build -f services/rag/Dockerfile -t rag-service:ci .

      - name: RAG-Service starten
        run: |
          # DATABASE_URL enthält "?schema=public" (ein Prisma-Query-Param) -
          # psycopg/libpq kennen den nicht und lehnen unbekannte URI-Query-
          # Parameter ab, deshalb hier abgeschnitten statt 1:1 übernommen.
          RAG_DATABASE_URL="${DATABASE_URL%%\?*}"
          docker run -d --name rag-service --network host \
            -e DATABASE_URL="$RAG_DATABASE_URL" \
            -v "$(pwd)/data/knowledge:/app/data/knowledge:ro" \
            rag-service:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && exit 0
            sleep 2
          done
          echo "RAG-Service nicht rechtzeitig hochgekommen" >&2
          docker logs rag-service
          exit 1

      - name: Wissensbasis einlesen
        run: docker exec rag-service rag-ingest

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: E2E-Tests ausführen
        run: npm run test:e2e --workspace=e2e
