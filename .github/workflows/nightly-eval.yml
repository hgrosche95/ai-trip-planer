name: Nightly Eval

on:
  schedule:
    # Täglich nachts statt bei jedem Push: ein Lauf macht pro golden case
    # mindestens einen echten Groq-Aufruf (Agent-Chat), mit
    # EVAL_JUDGE_ENABLED=true zusätzlich einen Judge-Aufruf - bei 8 Fällen
    # grob 15-25 Aufrufe pro Lauf. Gegen Groqs Free-Tier-Limit von ca.
    # 1.000 Requests/Tag (siehe Plan, Anhang A) würde ein Lauf pro Push an
    # einem aktiven Tag spürbar vom Budget für den eigentlichen Chat-Betrieb
    # abgehen. Ein Lauf pro Nacht reicht, um Qualitätsverschlechterungen zu
    # erkennen.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Anbieter des Agenten (der Judge ist immer Groq)
        type: choice
        options: [groq, anthropic, beide]
        default: groq

# Zwei Nachtläufe gleichzeitig würden sich das Groq-Limit teilen und beim
# Schreiben in eval-data gegenseitig überholen
concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  # secrets sind laut GitHub-Actions-Doku NICHT im Kontext von
  # jobs.<job_id>.if verfügbar (nur github/needs/vars/inputs) - dieser
  # vorgeschaltete, billige Job liest die Secrets stattdessen in einem
  # run:-Schritt (dort ist secrets erlaubt) und gibt nur die Liste der
  # Anbieter weiter, nie einen Wert selbst.
  #
  # Groq läuft jede Nacht. Anthropic nur, wenn man es per Hand startet
  # (Run workflow mit provider anthropic oder beide): Jeder Anthropic-Lauf
  # kostet echtes Geld und soll nie automatisch passieren. Ohne
  # GROQ_API_KEY läuft gar nichts, weil der Judge immer Groq ist (gleicher
  # Judge = vergleichbare Zahlen).
  plan:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - id: plan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          providers=()
          if [ -n "$GROQ_API_KEY" ]; then
            if [ "$INPUT_PROVIDER" != "anthropic" ]; then
              providers+=('"groq"')
            fi
            if [ -n "$ANTHROPIC_API_KEY" ] && {
              [ "$INPUT_PROVIDER" = anthropic ] || [ "$INPUT_PROVIDER" = beide ]
            }; then
              providers+=('"anthropic"')
            fi
          fi
          list=$(IFS=,; echo "[${providers[*]}]")
          echo "Anbieter: $list"
          echo "providers=$list" >> "$GITHUB_OUTPUT"

  nightly-eval:
    needs: plan
    if: needs.plan.outputs.providers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Nacheinander: Auch der Anthropic-Lauf fragt den Groq-Judge
      max-parallel: 1
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: trip_planner
          POSTGRES_PASSWORD: trip_planner
          POSTGRES_DB: trip_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip_planner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trip_planner:trip_planner@localhost:5432/trip_planner?schema=public
      LLM_PROVIDER: ${{ matrix.provider }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RAG_SERVICE_URL: http://localhost:8001
      TRIP_PLANNER_API_URL: http://localhost:3000
      # Ephemere Postgres-Instanz dieses CI-Laufs, kein echter Nutzer -
      # dieselben Werte wie im e2e-Job in ci.yml, aus demselben Grund als
      # Klartext statt Repo-Secret.
      AUTH_USERNAME: e2e-test
      AUTH_PASSWORD_HASH: $2b$10$zwnaSFwRDXWN8ARQ2MKCReoqD566HMLU2DDgb2BZwoNNXRS82H91C
      JWT_SECRET: Ddo4z26AQj4WRfpebbv+9hVNMwlUzyLsUWo8Ejstgkg=
      TRIP_PLANNER_USERNAME: e2e-test
      TRIP_PLANNER_PASSWORD: e2e-test-password
      EVAL_JUDGE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Datenbank-Migrationen anwenden
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: RAG-Service bauen
        run: docker build -f services/rag/Dockerfile -t rag-service:ci .

      - name: RAG-Service starten
        run: |
          RAG_DATABASE_URL="${DATABASE_URL%%\?*}"
          docker run -d --name rag-service --network host \
            -e DATABASE_URL="$RAG_DATABASE_URL" \
            -v "$(pwd)/data/knowledge:/app/data/knowledge:ro" \
            rag-service:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && exit 0
            sleep 2
          done
          echo "RAG-Service nicht rechtzeitig hochgekommen" >&2
          docker logs rag-service
          exit 1

      - name: Wissensbasis einlesen
        run: docker exec rag-service rag-ingest

      - name: Backend starten
        working-directory: apps/api
        run: |
          npm run start:dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "Backend nicht rechtzeitig hochgekommen" >&2
          cat /tmp/api.log
          exit 1

      - name: Eval-Harness ausführen
        run: npm run eval --workspace=evals

      # Szenario-Evals gegen den Multi-Agenten-Modus (evals/scenarios.json):
      # 12 ganze Reiseanfragen über POST /agent/runs, Kennzahlen aus den
      # Ereignissen nachgerechnet, Judge für Plan-Qualität, Ehrlichkeit und
      # Injection-Resistenz. Grob 80.000-100.000 Groq-Tokens pro Nacht.
      # success() || failure(): läuft auch, wenn die Wissens-Evals davor
      # ihre Schwellen verfehlt haben - beide Ergebnisse sind interessant.
      - name: Szenario-Evals ausführen
        if: success() || failure()
        run: npm run eval:scenarios --workspace=evals

      # Ohne das Log der API bleibt ein HTTP 500 im Eval-Lauf ein Rätsel
      - name: API-Log bei Fehlern ausgeben
        if: failure()
        run: tail -n 200 /tmp/api.log

      # if: always() - der Report soll auch dann hochgeladen werden (und vor
      # allem dann interessant sein), wenn der vorige Schritt wegen
      # unterschrittener Schwellen mit Exit-Code 1 fehlgeschlagen ist.
      - name: Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-${{ matrix.provider }}
          path: |
            evals/reports/*.md
            evals/reports/*.json
          if-no-files-found: warn

  # Hängt die JSON-Reports an history.json im Orphan-Branch eval-data an und
  # schreibt badge.json. Die Seite /evals und das README-Badge lesen beides
  # über raw.githubusercontent.com - ohne Deploy und auch dann, wenn die API
  # gerade auf 0 skaliert ist. Läuft auch nach verfehlten Schwellen (genau
  # die sollen sichtbar werden), aber nur für main: Probeläufe von anderen
  # Branches sollen die öffentliche Historie nicht füllen.
  publish:
    needs: [plan, nightly-eval]
    if: always() && needs.plan.outputs.providers != '[]' && needs.nightly-eval.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --workspace=evals

      - uses: actions/download-artifact@v8
        with:
          pattern: eval-report-*
          path: eval-reports

      - name: Branch eval-data auschecken
        run: |
          if git ls-remote --exit-code --heads origin eval-data > /dev/null; then
            git fetch --depth=1 origin +refs/heads/eval-data:refs/remotes/origin/eval-data
            git worktree add -B eval-data eval-data origin/eval-data
          else
            git worktree add --orphan -b eval-data eval-data
          fi

      - name: Historie und Badge schreiben
        run: npm run eval:publish --workspace=evals -- ../eval-reports ../eval-data

      - name: eval-data pushen
        working-directory: eval-data
        run: |
          if [ ! -f README.md ]; then
            printf '%s\n' \
              '# eval-data' '' \
              'Automatisch geschrieben von `.github/workflows/nightly-eval.yml` (Job `publish`).' \
              'Nicht von Hand bearbeiten. `history.json` speist die Seite `/evals`, `badge.json` das README-Badge.' \
              > README.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Keine Änderung'
            exit 0
          fi
          git commit -m "evals: Lauf ${GITHUB_RUN_ID}"
          git push origin eval-data
