services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-trip-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trip_planner
      POSTGRES_PASSWORD: trip_planner
      POSTGRES_DB: trip_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
